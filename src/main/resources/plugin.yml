main: me.zeronull.spawnarena.SpawnArena
name: SpawnArena
version: 1.0.0
api-version: '1.21'
softdepend:
  - voicechat
  - Vault
  - WorldEdit
  - FastAsyncWorldEdit
  - WorldGuard
  - PlaceholderAPI
  - FancyHolograms
  - TAB
  - Parkour
  - bunnyAC
folia-supported: true

commands:
  joinarenaqueue:
    description: Join an arena's queue straight away (again to leave), or open the 1v1 / 2v2 / Auto menu
    usage: "/joinarenaqueue <arena> [1v1|2v2|auto|menu]"
    permission: spawnarena.joinarenaqueue
    permission-message: "§cYou don't have permission!"
  setarenaspawn:
    description: Set an arena's spawn point 1 or 2 where you're standing
    usage: "/setarenaspawn <1|2> <arena>"
    permission: spawnarena.setarenaspawn
    permission-message: "§cYou don't have permission!"
  createarena:
    description: Create an arena
    permission: spawnarena.createarena
    permission-message: "§cYou don't have permission!"
  togglearenamode:
    description: Switch an arena between SINGLE and MULTI or free-for-all on and off with "ffa" (only while it's empty), or random sumo variants on and off with "random" (sumo arenas only, from the next match)
    usage: "/togglearenamode <arena> [ffa|random]"
    permission: spawnarena.togglearenamode
    permission-message: "§cYou don't have permission!"
  setupfight:
    description: Set up a 1v1 (2 players) or a 2v2 (4 players; first two vs last two)
    permission: spawnarena.setupfight
    permission-message: "§cYou don't have permission!"
  setarenaschematic:
    description: Set the schematic of an arena
    permission: spawnarena.setarenaschematic
    permission-message: "§cYou don't have permission!"
  setpastelocation:
    description: Set the paste location of an arena
    permission: spawnarena.setpastelocation
    permission-message: "§cYou don't have permission!"
  restore:
    description: Restore a players data from before the fight
    permission: spawnarena.restore
    permission-message: "§cYou don't have permission!"
  arenastats:
    description: View or edit a player's arena stats (wins, losses, games, streaks, Elo, free-for-all kills, money made), or count players per arena
    permission: spawnarena.arenastats
    permission-message: "§cYou don't have permission!"
  arenaleaderboard:
    description: View the arena leaderboard, or spawn/remove/list leaderboard holograms
    usage: "/arenaleaderboard [arena] [stat] [limit] | spawn <arena> <stat|reward> [limit] | remove <name> | list | tp <name> | reload | update"
    permission: spawnarena.arenaleaderboard
    permission-message: "§cYou don't have permission!"

  arenaannounce:
    description: Toggle whether fight results are broadcast to everyone or only the two fighters
    usage: "/arenaannounce [on|off]"
    permission: spawnarena.arenaannounce
    permission-message: "§cYou don't have permission!"

  arenalock:
    description: Close or open the arenas (no new queues or fights while closed; closing sends everyone out of free-for-alls)
    usage: "/arenalock [on|off]"
    permission: spawnarena.arenalock
    permission-message: "§cYou don't have permission!"

  arenareload:
    description: Reload settings.yml and arena configs
    usage: "/arenareload"
    permission: spawnarena.arenareload
    permission-message: "§cYou don't have permission!"

  setarenaexit:
    description: Set where non-fighters are sent when they're in the arena during a fight
    usage: "/setarenaexit <arena>"
    permission: spawnarena.setarenaexit
    permission-message: "§cYou don't have permission!"

  arenaduel:
    description: Accept, deny or cancel duel requests, or toggle receiving them (shift-right-click a player near an arena to send one)
    usage: "/arenaduel accept|deny|cancel <player> | toggle"
    permission: spawnarena.duel
    permission-message: "§cYou don't have permission!"

  arenasetup:
    description: Set up a new arena step by step (paste, region, spawns, exit, options), with undo
    usage: "/arenasetup <name>"
    permission: spawnarena.arenasetup
    permission-message: "§cYou don't have permission!"
  arenabet:
    description: Bet on your next fight (win it back plus a bonus, lose it); cancelled if that fight can't pay out
    usage: "/arenabet <amount|off>"
    permission: spawnarena.arenabet
    permission-message: "§cYou don't have permission!"
  arenawins:
    description: Toggle seeing other players' arena win announcements in chat
    usage: "/arenawins"
    permission: spawnarena.arenawins
    permission-message: "§cYou don't have permission!"

  arenadrop:
    description: Switch dropping items in arena fights on or off for yourself (staff)
    usage: "/arenadrop"
    permission: spawnarena.allowdropinfight
    permission-message: "§cYou don't have permission!"

  leavearena:
    description: Leave a free-for-all arena (only out of combat)
    usage: "/leavearena"
    permission: spawnarena.leavearena
    permission-message: "§cYou don't have permission!"

permissions:
  spawnarena.arenastats.rollback:
    description: Roll back stat changes made by a staff member (/arenastats rollback)
    default: op
  spawnarena.crystalarena.build:
    description: Build in crystal PvP arenas when no fight is running (to edit the arena)
    default: op
  spawnarena.setarenaspawn:
    default: op
  spawnarena.joinarenaqueue:
    default: op
  spawnarena.joinarenaqueue.modes:
    description: Queue 2v2 or auto, and open the queue menu (/joinarenaqueue <arena> 2v2|auto|menu); without it, 1v1 only
    default: op
  spawnarena.createarena:
    default: op
  spawnarena.allowcommandsinfight:
    default: op
  spawnarena.togglearenamode:
    default: op
  spawnarena.setupfight:
    default: op
  spawnarena.setarenaschematic:
    default: op
  spawnarena.setpastelocation:
    default: op
  spawnarena.restore:
    default: op
  spawnarena.arenastats:
    default: op
  spawnarena.arenaleaderboard:
    default: true
  spawnarena.arenaleaderboard.spawn:
    default: op
  spawnarena.arenaannounce:
    default: op
  spawnarena.arenalock:
    default: op
  spawnarena.arenareload:
    default: op
  spawnarena.setarenaexit:
    default: op
  spawnarena.bypasskickout:
    description: Can stay inside arenas during other players' fights
    default: false
  spawnarena.duel:
    default: true
  spawnarena.arenasetup:
    default: op
  spawnarena.arenabet:
    default: true
  spawnarena.arenawins:
    default: true
  spawnarena.leavearena:
    default: true
  spawnarena.allowdropinfight:
    description: Can use /arenadrop to drop items in arena fights (off until they switch it on)
    default: op
